[project]
name = "finance-sync"
version = "0.1.0"
description = "Daily SimpleFIN to Google Sheets transaction sync, categorized."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sheets = [
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.0",
]
jev = ["typesafe-sdk"]
dev = ["pytest>=8.0"]

[project.scripts]
finance-sync = "finance_sync.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
